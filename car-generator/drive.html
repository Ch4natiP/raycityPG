<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RayCity Drive</title>
  <style>
    html, body { margin: 0; height: 100%; background: #10131a; color: #ececec; font: 14px/1.4 system-ui, "Noto Sans Thai", "Segoe UI", sans-serif; overflow: hidden; }
    #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; left: 12px; top: 10px; display: flex; flex-direction: column; gap: 6px; max-width: min(360px, calc(100% - 24px)); }
    .box { background: rgba(20, 24, 34, .82); border: 1px solid #2f3747; border-radius: 10px; padding: 8px 10px; }
    .box b { color: #ff9f1a; }
    #speed { position: fixed; right: 16px; bottom: 14px; text-align: right; font-variant-numeric: tabular-nums; }
    #speed .v { font-size: 44px; font-weight: 700; line-height: 1; }
    #speed .u { color: #a2a2a2; }
    #lap { position: fixed; right: 16px; top: 10px; text-align: right; font-variant-numeric: tabular-nums; }
    button, select, input[type=color] { background: #2b3242; color: #ececec; border: 1px solid #44506a; border-radius: 8px; padding: 6px 10px; font: inherit; cursor: pointer; }
    .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .hint { color: #a2a2a2; font-size: 12px; }
    #touch { position: fixed; bottom: 14px; left: 12px; display: none; gap: 8px; }
    #touch button { width: 64px; height: 64px; font-size: 22px; border-radius: 50%; opacity: .85; touch-action: none; }
    @media (pointer: coarse) { #touch { display: flex; } }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="hud">
    <div class="box"><b>RayCity Drive</b> <span class="hint">ต้นแบบเกมแข่งบนเว็บ</span></div>
    <div class="box">
      <div class="row"><button id="btn-car">📂 เปิดรถ (.zip)</button><input id="file-car" type="file" accept=".zip" hidden>
        <span>สี</span><input id="c1" type="color" value="#e8e8e8" title="สี 1"><input id="c2" type="color" value="#2a6bd8" title="สี 2"><input id="c3" type="color" value="#d63a2f" title="สี 3"></div>
      <div id="car-info" class="hint">รถ: Escarabajo (ในตัว)</div>
    </div>
    <div class="box">
      <div class="row"><span>สนาม</span><select id="track" style="max-width: 260px"><option value="practice">สนามฝึก (วงปิด)</option></select></div>
      <div id="track-info" class="hint"></div>
    </div>
    <div class="box hint">W/↑ เร่ง · S/↓ เบรก/ถอย · A D/← → เลี้ยว · Space เบรกมือ (ดริฟต์) · R กลับจุดเริ่ม · C เปลี่ยนกล้อง</div>
  </div>
  <div id="lap" class="box"><div>รอบ <b id="lap-n">0</b></div><div>เวลา <span id="lap-t">0:00.00</span></div><div class="hint">ดีสุด <span id="lap-best">-</span></div></div>
  <div id="speed" class="box"><div class="v" id="kmh">0</div><div class="u">กม./ชม.</div></div>
  <div id="touch"><button data-k="left">◀</button><button data-k="right">▶</button><button data-k="down">⏬</button><button data-k="up">⏫</button></div>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <script src="js/embedded-cars.js"></script>
  <script src="js/drive/rc-city.js"></script>
  <script type="module" src="js/drive/drive.js"></script>
</body>
</html>
