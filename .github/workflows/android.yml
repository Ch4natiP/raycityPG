# Builds the phone app (mobile/: the Drive page in a Capacitor Android shell) and keeps the APK as the run's
# artifact "RayCity-PG-apk" (Actions → this run → Artifacts). A debug-signed APK, to install by hand on phones.
name: Android APK
on:
  push:
    paths: ['mobile/**', 'car-generator/RayCity-Drive.html', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            mobile
            car-generator/RayCity-Drive.html
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Web page into the app
        working-directory: mobile
        run: npm ci && node copy-web.mjs && npx cap sync android
      - name: Build
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RayCity-PG-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
